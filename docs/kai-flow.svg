<svg xmlns="http://www.w3.org/2000/svg" width="880" height="630" viewBox="0 0 880 630" role="img" aria-labelledby="title desc">
<title id="title">How Kai works</title>
<desc id="desc">Three commands take a ticket to done. From level 2, /kai:spec writes the spec and any ADR for a Definition PR, or says to skip it for a low-tier change. /kai:implement plans, waits for your approval, commits failing tests, writes the minimum code, proves it, reviews it, and answers the change PR reviewers until a person merges it. At level 4, /kai:accept verifies the deployed change and tries to break it. When it passes, it runs the retro and opens a cleanup PR. When it fails, it creates a fix branch with the reproduction; you run /kai:implement there, then /kai:accept again.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker>
<marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e"/></marker>
</defs>
<rect x="0" y="0" width="262" height="54" rx="8" fill="#4338ca"/>
<text x="131.0" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle"><tspan font-weight="bold">1 · DEFINE · LEVEL 2+</tspan></text>
<text x="131.0" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#ffffff" text-anchor="middle"><tspan font-weight="bold">/kai:spec PAY-123</tspan></text>
