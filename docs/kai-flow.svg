<text x="131.0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Linear, or GitHub</tspan></text>
<line x1="131.0" y1="119" x2="131.0" y2="127" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="0" y="129" width="262" height="50" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="131.0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Low-tier files only? Skips the</tspan></text>
<text x="131.0" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">spec and goes to /kai:implement</tspan></text>
<line x1="131.0" y1="180" x2="131.0" y2="188" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="0" y="190" width="262" height="67" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="131.0" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Writes spec.md: EARS criteria</tspan></text>
<text x="131.0" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">and a contract that maps each</tspan></text>
<text x="131.0" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">criterion to a test</tspan></text>
<line x1="131.0" y1="258" x2="131.0" y2="266" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="0" y="268" width="262" height="50" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="131.0" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Records an ADR in docs/adr/</tspan></text>
<text x="131.0" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">when the change needs a decision</tspan></text>
<line x1="131.0" y1="319" x2="131.0" y2="327" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="0" y="329" width="262" height="67" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="131.0" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="bold">Definition PR</tspan></text>
<text x="131.0" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="normal">Product and engineering approve</tspan></text>
<text x="131.0" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="normal">and merge it before any code</tspan></text>
<rect x="309" y="0" width="262" height="54" rx="8" fill="#4338ca"/>
<text x="440.0" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle"><tspan font-weight="bold">2 · BUILD</tspan></text>
<text x="440.0" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#ffffff" text-anchor="middle"><tspan font-weight="bold">/kai:implement PAY-123</tspan></text>
<rect x="309" y="68" width="262" height="33" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="440.0" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Explores the code, writes plan.md</tspan></text>
<line x1="440.0" y1="102" x2="440.0" y2="110" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="309" y="112" width="262" height="33" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="440.0" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#451a03" text-anchor="middle"><tspan font-weight="normal">You approve the plan</tspan></text>
<line x1="440.0" y1="146" x2="440.0" y2="154" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="309" y="156" width="262" height="50" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="440.0" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Commits the failing tests,</tspan></text>
<text x="440.0" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">locked for the ticket</tspan></text>
<line x1="440.0" y1="207" x2="440.0" y2="215" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="309" y="217" width="262" height="50" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="440.0" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Writes the minimum code</tspan></text>
<text x="440.0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">that makes them pass</tspan></text>
<line x1="440.0" y1="268" x2="440.0" y2="276" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="309" y="278" width="262" height="50" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="440.0" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Proves it: kai verify writes</tspan></text>
<text x="440.0" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">evidence.md for every criterion</tspan></text>
<line x1="440.0" y1="329" x2="440.0" y2="337" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="309" y="339" width="262" height="50" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="440.0" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Independent review by read-only</tspan></text>
<text x="440.0" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">agents, then fixes what they find</tspan></text>
<line x1="440.0" y1="390" x2="440.0" y2="398" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="309" y="400" width="262" height="84" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="440.0" y="421" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="bold">Change PR</tspan></text>
<text x="440.0" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="normal">CI gates post a verdict comment.</tspan></text>
<text x="440.0" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="normal">Claude fixes or defends, with</tspan></text>
<text x="440.0" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="normal">evidence, each reviewer's finding</tspan></text>
<line x1="440.0" y1="485" x2="440.0" y2="493" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="309" y="495" width="262" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="440.0" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#451a03" text-anchor="middle"><tspan font-weight="normal">A person approves and merges,</tspan></text>
<text x="440.0" y="533" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#451a03" text-anchor="middle"><tspan font-weight="normal">and it deploys to integration</tspan></text>
<rect x="618" y="0" width="262" height="54" rx="8" fill="#4338ca"/>
<text x="749.0" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle"><tspan font-weight="bold">3 · ACCEPT</tspan></text>
<text x="749.0" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#ffffff" text-anchor="middle"><tspan font-weight="bold">/kai:accept PAY-123</tspan></text>
<rect x="618" y="68" width="262" height="50" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="749.0" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Verifies the deployed change</tspan></text>
<text x="749.0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">against the spec and the ticket</tspan></text>
<line x1="749.0" y1="119" x2="749.0" y2="127" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="618" y="129" width="262" height="33" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="749.0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Tries to break it with adversarial QA</tspan></text>
<line x1="749.0" y1="163" x2="749.0" y2="171" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="618" y="173" width="262" height="67" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
<text x="749.0" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">Runs the retro: lessons go into</tspan></text>
<text x="749.0" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">CLAUDE.md, skills, or ADRs, and</tspan></text>
<text x="749.0" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1e1b4b" text-anchor="middle"><tspan font-weight="normal">hooks or scripts become tickets</tspan></text>
<line x1="749.0" y1="241" x2="749.0" y2="249" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="618" y="251" width="262" height="67" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="749.0" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="bold">Cleanup PR</tspan></text>
<text x="749.0" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="normal">Deletes specs/PAY-123, keeps</tspan></text>
<text x="749.0" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#052e16" text-anchor="middle"><tspan font-weight="normal">ADRs, applies the retro's changes</tspan></text>
<line x1="749.0" y1="319" x2="749.0" y2="327" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="618" y="329" width="262" height="33" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="749.0" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#451a03" text-anchor="middle"><tspan font-weight="normal">A person merges it: done</tspan></text>
<line x1="630" y1="383" x2="868" y2="383" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="618" y="401" width="262" height="67" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="749.0" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#4c0519" text-anchor="middle"><tspan font-weight="bold">If it fails:</tspan><tspan font-weight="normal"> creates PAY-123-fix-n</tspan></text>
<text x="749.0" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#4c0519" text-anchor="middle"><tspan font-weight="normal">with the reproduction, and you</tspan></text>
<text x="749.0" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#4c0519" text-anchor="middle"><tspan font-weight="normal">run /kai:implement on it</tspan></text>
<line x1="266" y1="27.0" x2="305" y2="27.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="575" y1="27.0" x2="614" y2="27.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
