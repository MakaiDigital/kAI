<rect x="0" y="563" width="880" height="50" rx="8" fill="#334155"/>
<text x="440.0" y="584" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#f1f5f9" text-anchor="middle"><tspan font-weight="bold">In every session:</tspan><tspan font-weight="normal"> hooks block skipping git hooks, production deploys without</tspan></text>
<text x="440.0" y="601" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#f1f5f9" text-anchor="middle"><tspan font-weight="normal">a named approval, and edits to locked tests. Claude never merges or approves a pull request.</tspan></text>
