schema_version: "1.1"
name: pm-acceptance-criteria
description: A product manager gets numbered EARS criteria with unhappy paths and a contract row per criterion from a ticket.
tags: [kai-product]
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Write]
  append_system_prompt: "No person is available to answer questions in this session. Where a skill asks you to check with the person, state the questions and the answers you are assuming, then continue. Save any files you produce in the working directory."
