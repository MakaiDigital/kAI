schema_version: "1.1"
name: worded-request-names-command
description: A request for workflow work in plain words does not start the workflow; Claude names the command that does it.
tags: [kai]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Bash, Write, Edit]
  append_system_prompt: "No person is available in this session. Never push to a remote or open pull requests."
