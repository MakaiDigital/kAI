schema_version: "1.1"
name: spec-from-ticket
description: Spec reads the ticket, then writes EARS criteria with unhappy paths and a FAIL contract row per criterion, writes the plan, and has three reviewers check both, on a ticket branch, ready for a Definition PR.
tags: [kai]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 120
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Bash, Write, Edit, Agent]
  append_system_prompt: "No person is available to answer questions in this session. Where a skill asks you to check with the person, state the questions and the answers you are assuming, then continue. Never push to a remote or open pull requests; write any pull request title and body to pr.md instead."
