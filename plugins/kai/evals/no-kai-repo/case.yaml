schema_version: "1.1"
name: no-kai-repo
description: In a repository without .kai/config, the kai skills step aside and the change is made normally.
tags: [kai]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Bash, Write, Edit]
  append_system_prompt: "No person is available in this session. Never push to a remote or open pull requests."
