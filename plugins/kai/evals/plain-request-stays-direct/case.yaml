schema_version: "1.1"
name: plain-request-stays-direct
description: In a Kai repository, a plain request is handled directly, without the workflow's specs, plans, or skills.
tags: [kai]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Bash, Write, Edit]
  append_system_prompt: "No person is available in this session. Never push to a remote or open pull requests."
