schema_version: "1.1"
name: accept-records-evidence
description: Accept runs the spec's end-to-end steps, records each command and output in accept.md, and leaves the verdict for a person.
tags: [kai]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Bash, Write, Edit]
  append_system_prompt: "No person is available to answer questions in this session. Where a skill asks you to check with the person, state the questions and the answers you are assuming, then continue. Never push to a remote or open pull requests."
