name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck and bats
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install shellcheck bats-core; else sudo apt-get update -q && sudo apt-get install -yq shellcheck bats; fi
      - run: shellcheck plugins/kai/bin/kai plugins/kai/scripts/*/*.sh
      - run: shellcheck -s bash plugins/kai/evals/*/scaffold.sh plugins/kai/evals/_fixture/make_repo.sh
      - run: bats tests/bats

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.289
      - run: claude plugin validate .
      - run: claude plugin validate plugins/kai
      - run: claude plugin validate plugins/kai-product

  versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a version bump for each changed plugin
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          status=0
          check() {
            manifest=plugins/$1/.claude-plugin/plugin.json
            shift
            changed=$(git diff --name-only "$base" HEAD -- "$@" | head -n 1)
            [ -n "$changed" ] || return 0
            old=$(git show "$base:$manifest" 2>/dev/null | jq -r .version)
            new=$(jq -r .version "$manifest")
            if [ "$old" = "$new" ]; then
              echo "::error::$changed changed, but $manifest still has version $new. Bump the version: installed users only receive a new one."
              status=1
            fi
          }
          check kai plugins/kai/ ':(exclude)plugins/kai/evals/' actions/kai-gates/
          check kai-product plugins/kai-product/ ':(exclude)plugins/kai-product/evals/'
          exit $status

  tag:
    if: github.event_name == 'push'
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the kai version
        run: |
          v=v$(jq -r .version plugins/kai/.claude-plugin/plugin.json)
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "$v is already tagged"
          else
            git tag "$v" && git push origin "$v"
          fi
